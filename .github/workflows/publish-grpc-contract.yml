name: Publish gRPC Contract

# One tag namespace per named service (grpc-<service>-v*.*.*), entirely independent of
# Tiki.Shared's own shared-v*.*.* release cadence even though both live in this repo.
on:
  push:
    tags:
      - "grpc-*-v*.*.*"

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — required for the ancestry check below

      - name: Refuse to run unless the tag is reachable from main
        run: |
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "::error::Tag ${{ github.ref_name }} (commit ${{ github.sha }}) is not reachable from main. Refusing to publish."
            exit 1
          fi
          echo "Verified: ${{ github.ref_name }} is reachable from main."

      - name: Parse the tag into a service name and version
        id: parse
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^grpc-([a-z]+)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Tag '$TAG' does not match the expected grpc-<service>-v<version> shape."
            exit 1
          fi

          SERVICE_LOWER="${BASH_REMATCH[1]}"
          TAG_VERSION="${BASH_REMATCH[2]}"

          case "$SERVICE_LOWER" in
            identity)    SERVICE="Identity" ;;
            wallet)      SERVICE="Wallet" ;;
            transaction) SERVICE="Transaction" ;;
            compliance)  SERVICE="Compliance" ;;
            integration) SERVICE="Integration" ;;
            *)
              echo "::error::Unknown service '$SERVICE_LOWER' in tag '$TAG'. Expected one of: identity, wallet, transaction, compliance, integration."
              exit 1
              ;;
          esac

          echo "service=$SERVICE" >> "$GITHUB_OUTPUT"
          echo "tag_version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Refuse to run unless the tag version matches this project's <Version>
        run: |
          CSPROJ="src/Grpc.Contracts/Tiki.Grpc.Contracts.${{ steps.parse.outputs.service }}/Tiki.Grpc.Contracts.${{ steps.parse.outputs.service }}.csproj"
          PROJECT_VERSION=$(grep -oP '(?<=<Version>)[^<]+' "$CSPROJ" | head -n1)

          if [ -z "$PROJECT_VERSION" ]; then
            echo "::error::$CSPROJ has no <Version> element to compare against."
            exit 1
          fi

          if [ "${{ steps.parse.outputs.tag_version }}" != "$PROJECT_VERSION" ]; then
            echo "::error::Tag version (${{ steps.parse.outputs.tag_version }}) does not match <Version> in $CSPROJ ($PROJECT_VERSION)."
            exit 1
          fi

          echo "Verified: tag version matches Tiki.Grpc.Contracts.${{ steps.parse.outputs.service }}."

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Tiki-shared.sln

      - name: Build
        run: dotnet build Tiki-shared.sln --no-restore --configuration Release

      - name: Test (package-contents checks for every contract)
        run: dotnet test tests/Grpc.Contracts.Tests/Tiki.Grpc.Contracts.Tests.csproj --no-build --configuration Release

      - name: Pack this contract only
        run: ./tools/pack-grpc-contract.sh ${{ steps.parse.outputs.service }}

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "artifacts/grpc-contracts/Tiki.Grpc.Contracts.${{ steps.parse.outputs.service }}.*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate
