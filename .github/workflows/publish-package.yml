name: Publish Package

on:
  push:
    tags:
      - "v*.*.*"

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Derive package version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Tiki-shared.sln

      - name: Build
        run: dotnet build Tiki-shared.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Tiki-shared.sln --no-build --configuration Release

      - name: Pack
        run: >
          dotnet pack src/Tiki.Shared/Tiki.Shared.csproj --no-build --configuration Release
          -p:PackageVersion=${{ steps.version.outputs.version }}
          --output ./artifacts

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate
