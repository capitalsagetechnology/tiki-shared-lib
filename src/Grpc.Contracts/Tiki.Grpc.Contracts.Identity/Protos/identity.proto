syntax = "proto3";

option csharp_namespace = "Tiki.Grpc.Contracts.Identity";

package tiki.grpc.contracts.identity;

service IdentityService {
  rpc Ping (PingRequest) returns (PingResponse);

  rpc GetTenantById (GetTenantByIdRequest) returns (TenantDetails);

  rpc GetBusinessOwnerProfile (GetBusinessOwnerProfileRequest) returns (BusinessOwnerProfileDetails);
  rpc UpdateBusinessOwnerProfile (UpdateBusinessOwnerProfileRequest) returns (BusinessOwnerProfileDetails);
}

message PingRequest {
}

message PingResponse {
  bool ok = 1;
}

// --- Tenant ---

message GetTenantByIdRequest {
  string tenant_id = 1;
}

message CountryDetails {
  string id = 1;
  string name = 2;
  string iso2 = 3;
  string iso3 = 4;
  string currency_code = 5;
  string dialling_code = 6;
  bool is_active = 7;
  bool business_onboarding_enabled = 8;
  bool customer_onboarding_enabled = 9;
}

message TenantDetails {
  string id = 1;
  string country_id = 2;
  string name = 3;
  repeated string default_currencies = 4;
  CountryDetails country = 5;
}

// --- Business Owner Profile ---

message GetBusinessOwnerProfileRequest {
  string user_id = 1;
}

message SocialMediaAccountDetails {
  // Tiki.Domain.Enums.SocialMediaProvider member name, e.g. "Instagram".
  string provider = 1;
  string url = 2;
}

message UpdateBusinessOwnerProfileRequest {
  string user_id = 1;
  string first_name = 2;
  string last_name = 3;
  string work_social_intent = 4;
  string occupation = 5;
  string government_id_url = 6;
  repeated SocialMediaAccountDetails social_media_accounts = 7;
}

message BusinessOwnerProfileDetails {
  string user_id = 1;
  string email = 2;
  bool email_verified = 3;
  string phone_number = 4;
  bool phone_number_verified = 5;
  string first_name = 6;
  string last_name = 7;
  string work_social_intent = 8;
  string occupation = 9;
  string government_id_url = 10;
  string kyc_status = 11;
  bool profile_completed = 12;
}
