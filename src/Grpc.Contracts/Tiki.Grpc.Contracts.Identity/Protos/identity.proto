syntax = "proto3";

option csharp_namespace = "Tiki.Grpc.Contracts.Identity";

package tiki.grpc.contracts.identity;

// Owning service: Identity. Every caller compiles against this package; nobody reaches into
// Identity's database. Tenant lookups dominate the traffic here — Wallet needs a tenant's
// wallet policy before it can provision, Compliance needs its country before it can pick a
// KYC provider — so those RPCs are shaped to answer in one round trip.
service IdentityService {
  rpc Ping (PingRequest) returns (PingResponse);

  // --- Tenant ---
  rpc GetTenantById (GetTenantByIdRequest) returns (TenantDetails);
  rpc GetTenantByCountry (GetTenantByCountryRequest) returns (TenantDetails);
  rpc ListTenants (ListTenantsRequest) returns (ListTenantsResponse);

  // Answers "should this user get a wallet, and in what currency?" on its own. Wallet
  // would otherwise fetch the whole tenant and re-derive the rule, and the two copies of
  // that rule would drift.
  rpc GetTenantWalletPolicy (GetTenantWalletPolicyRequest) returns (TenantWalletPolicy);

  // --- Business owner profile ---
  rpc GetBusinessOwnerProfile (GetBusinessOwnerProfileRequest) returns (BusinessOwnerProfileDetails);
  rpc UpdateBusinessOwnerProfile (UpdateBusinessOwnerProfileRequest) returns (BusinessOwnerProfileDetails);

  // --- Business ---
  rpc GetBusinessById (GetBusinessByIdRequest) returns (BusinessDetails);
  // merchant_id is the code minted at signup from the MERCHANT reference definition — a
  // stable, human-usable key some callers already hold instead of the business's own id.
  rpc GetBusinessByMerchantId (GetBusinessByMerchantIdRequest) returns (BusinessDetails);
  // Every business the user is an accepted team member of, owner or not.
  rpc GetBusinessesByUserId (GetBusinessesByUserIdRequest) returns (ListBusinessesResponse);

  // --- Customer ---
  rpc GetCustomerById (GetCustomerByIdRequest) returns (CustomerDetails);
  rpc UpdateCustomer (UpdateCustomerRequest) returns (CustomerDetails);

  // --- Transaction ---
  rpc ValidateTransactionPin (ValidateTransactionPinRequest) returns (ValidateTransactionPinResult);

  // --- Business API ---
  // Where to deliver a business's webhooks in one environment, and the secret to sign them with.
  // For tiki-business-api only: Identity refuses any other caller with PERMISSION_DENIED, because
  // the answer carries the signing secret in plaintext. The secret is stored encrypted and is
  // decrypted for this call alone; callers cache it briefly and never persist it.
  rpc GetBusinessWebhook (GetBusinessWebhookRequest) returns (BusinessWebhook);

  // --- Business customers ---
  // A business's own customers: people it pays on behalf of. Not users — no credentials, never
  // log in — and never Tiki customers. Scoped to (business, environment): a sandbox key never
  // sees a live customer. The business-web console manages them over Identity's REST API; these
  // RPCs are for tiki-business-api (all of them) and tiki-wallet-api (Get and Claim only).
  //
  // Failures carry a machine-readable code in the "tiki-error-code" trailer:
  //   INVALID_ARGUMENT     INVALID_REQUEST
  //   NOT_FOUND            CUSTOMER_NOT_FOUND (also: another business's, or the other environment's)
  //   ALREADY_EXISTS       CUSTOMER_EMAIL_TAKEN (email unique per business + environment among
  //                        customers that are not archived)
  //   FAILED_PRECONDITION  CUSTOMER_HAS_PAYMENTS (delete once a payment named it: archive instead),
  //                        CUSTOMER_ARCHIVED, CUSTOMER_NOT_VERIFIED (KYC not approved),
  //                        CONTACT_CHANGED (the verified address is no longer the customer's)
  rpc CreateBusinessCustomer (CreateBusinessCustomerRequest) returns (BusinessCustomer);
  // Archived customers included, so history and old payments still resolve.
  rpc GetBusinessCustomer (GetBusinessCustomerRequest) returns (BusinessCustomer);
  // Newest first. Archived customers only with include_archived.
  rpc ListBusinessCustomers (ListBusinessCustomersRequest) returns (ListBusinessCustomersResponse);
  // Changing the email (or phone) clears its verification. An archived customer cannot change.
  rpc UpdateBusinessCustomer (UpdateBusinessCustomerRequest) returns (BusinessCustomer);
  // Removes the customer for good, only while no payment has named it (CUSTOMER_HAS_PAYMENTS).
  rpc DeleteBusinessCustomer (DeleteBusinessCustomerRequest) returns (DeleteBusinessCustomerResponse);
  // Hidden from lists and pickers and refused on new payments; kept for history. Idempotent.
  rpc ArchiveBusinessCustomer (ArchiveBusinessCustomerRequest) returns (BusinessCustomer);
  // The customer's identity verification as Compliance reported it (subject "bcust:{id}").
  // A status for an older verification than the current one is ignored.
  rpc RecordBusinessCustomerKyc (RecordBusinessCustomerKycRequest) returns (BusinessCustomer);
  // A one-time code sent to the customer's email or phone was confirmed.
  rpc MarkBusinessCustomerContactVerified (MarkBusinessCustomerContactVerifiedRequest) returns (BusinessCustomer);
  // Wallet, before a payment names the customer as its originator: refuses unless the customer
  // belongs to the business in that environment, is KYC-approved and not archived, and from then
  // on the customer can only be archived (DeleteBusinessCustomer answers CUSTOMER_HAS_PAYMENTS).
  rpc ClaimBusinessCustomerForPayment (ClaimBusinessCustomerForPaymentRequest) returns (BusinessCustomer);
}

message PingRequest {
}

message PingResponse {
  bool ok = 1;
}

// --- Tenant ---

message GetTenantByIdRequest {
  string tenant_id = 1;
}

message GetTenantByCountryRequest {
  // ISO 3166-1 alpha-2, e.g. "NG". A country has at most one tenant, so this identifies
  // exactly one — which is what makes it usable as the tenant resolver at signup.
  string country_iso2 = 1;
}

message ListTenantsRequest {
  int32 page_num = 1;
  int32 page_size = 2;
  // When set, returns only tenants that are / are not active.
  optional bool is_active = 3;
  // When set, returns only tenants that can / cannot hold wallets.
  optional bool can_hold_wallet = 4;
}

message ListTenantsResponse {
  repeated TenantDetails items = 1;
  int64 total_count = 2;
  int32 page_num = 3;
  int32 page_size = 4;
}

message GetTenantWalletPolicyRequest {
  string tenant_id = 1;
}

// The answer to "provision a wallet for this user, or not?" — and if so, in what currency.
message TenantWalletPolicy {
  string tenant_id = 1;
  bool can_hold_wallet = 2;
  // ISO 4217, e.g. "NGN". Empty exactly when can_hold_wallet is false; Identity guarantees
  // a wallet-holding tenant always has one, so a caller never has to invent a fallback.
  string default_currency = 3;
  // Currencies a user in this tenant may additionally hold beyond the default.
  repeated string supported_currencies = 4;
}

message CountryDetails {
  string id = 1;
  string name = 2;
  string iso2 = 3;
  string iso3 = 4;
  string currency_code = 5;
  string dialling_code = 6;
  bool is_active = 7;
  bool business_onboarding_enabled = 8;
  bool customer_onboarding_enabled = 9;
}

message TenantDetails {
  string id = 1;
  string country_id = 2;
  string name = 3;
  CountryDetails country = 4;

  // One tenant per country, so this is a stable, human-usable key — "NG" identifies the
  // Nigerian tenant without a lookup table.
  string country_iso2 = 5;

  // Whether users onboarded into this tenant get wallets at all. A tenant may exist purely
  // to onboard and verify users in a market Tiki does not yet hold funds in.
  bool can_hold_wallet = 6;

  // ISO 4217. Set exactly when can_hold_wallet is true — the currency a new user's wallet
  // is created in after successful onboarding.
  string default_currency = 7;

  // Additional currencies a wallet in this tenant may hold. Never includes default_currency.
  repeated string supported_currencies = 8;

  bool is_active = 9;
  string created_at = 10;
  string updated_at = 11;
}

// --- Business Owner Profile ---

message GetBusinessOwnerProfileRequest {
  string user_id = 1;
}

message SocialMediaAccountDetails {
  // Tiki.Domain.Enums.SocialMediaProvider member name, e.g. "Instagram".
  string provider = 1;
  string url = 2;
}

message UpdateBusinessOwnerProfileRequest {
  string user_id = 1;
  string first_name = 2;
  string last_name = 3;
  string work_social_intent = 4;
  string occupation = 5;
  string government_id_url = 6;
  repeated SocialMediaAccountDetails social_media_accounts = 7;
}

message BusinessOwnerProfileDetails {
  string user_id = 1;
  string email = 2;
  bool email_verified = 3;
  string phone_number = 4;
  bool phone_number_verified = 5;
  string first_name = 6;
  string last_name = 7;
  string work_social_intent = 8;
  string occupation = 9;
  string government_id_url = 10;
  string kyc_status = 11;
  bool profile_completed = 12;
}

// --- Business ---

message GetBusinessByIdRequest {
  string business_id = 1;
}

message GetBusinessByMerchantIdRequest {
  string merchant_id = 1;
}

message GetBusinessesByUserIdRequest {
  string user_id = 1;
}

message ListBusinessesResponse {
  repeated BusinessDetails items = 1;
}

message BusinessDetails {
  string id = 1;
  // Empty for a business created before this field existed.
  string merchant_id = 2;
  string owner_user_id = 3;
  string name = 4;
  string tenant_id = 5;
  string country_id = 6;
  // Identity.Domain.Enums.BusinessKycStatus member name, e.g. "InReview".
  string kyc_status = 7;
  // Identity.Domain.Enums.BusinessStatus member name, e.g. "Active".
  string status = 8;
  string created_at = 9;
  string updated_at = 10;
  // ISO 3166-1 alpha-2 of the business's country (country_id), e.g. "KE".
  string country_iso2 = 11;
  // The business's own contact phone in E.164, e.g. "+254712345678". Empty when the owner has not
  // set one — a business created before this field existed.
  string phone_number = 12;
  // Identity.Domain.Enums.FeeModel member name from the business's commercial contract:
  // "PayloadDeduction", "PrefundedAccount" or "MonthlyInvoicing". Empty when the business has no
  // contract. Wallet reads it to decide how a fee is collected.
  string fee_model = 13;
}

// --- Customer ---

message GetCustomerByIdRequest {
  string user_id = 1;
}

// Partial update — only the fields actually set (see the generated per-field `HasXxx`) are
// applied; a field left unset leaves that property untouched on the entity.
message UpdateCustomerRequest {
  string user_id = 1;
  optional string first_name = 2;
  optional string last_name = 3;
  optional string username = 4;
  // Tiki.Shared.Core.Enums.CitizenshipStatus member name, e.g. "Citizen".
  optional string citizenship_status = 5;
  optional string country_id = 6;
  // Tiki.Shared.Core.Enums.KycStatus member name, e.g. "InReview".
  optional string kyc_status = 7;
  // ISO 8601 date, e.g. "1990-01-01".
  optional string dob = 8;
  optional string address = 9;
  optional string city = 10;
  optional string state = 11;
  optional string occupation = 12;
  optional string referral_code = 13;
  // Tiki.Shared.Core.Enums.AddressVerificationStatus member name, e.g. "Verified".
  optional string address_verification_status = 14;
  // Tiki.Shared.Core.Enums.CustomerStatus member name, e.g. "Active".
  optional string customer_status = 15;
  // Tiki.Shared.Core.Enums.SanctionScreeningStatus member name, e.g. "NoMatch".
  optional string sanction_screening_status = 16;
  optional string status_update_reason = 17;
}

message CustomerDetails {
  string user_id = 1;
  string email = 2;
  bool email_verified = 3;
  string phone_number = 4;
  bool phone_number_verified = 5;
  string first_name = 6;
  string last_name = 7;
  string username = 8;
  string citizenship_status = 9;
  string kyc_status = 10;
  bool has_transaction_pin = 11;
  CountryDetails country = 12;
  // ISO 8601 date, e.g. "1990-01-01". Empty when unset.
  string dob = 13;
  string address = 14;
  string city = 15;
  string state = 16;
  string occupation = 17;
  string referral_code = 18;
  string address_verification_status = 19;
  string customer_status = 20;
  string sanction_screening_status = 21;
  string status_update_reason = 22;
}

message ValidateTransactionPinRequest {
  string user_id = 1;
  string pin = 2;
}

message ValidateTransactionPinResult {
  bool is_valid = 1;
}

// --- Business API ---

enum BusinessApiEnvironment {
  BUSINESS_API_ENVIRONMENT_UNSPECIFIED = 0;
  BUSINESS_API_ENVIRONMENT_SANDBOX = 1;
  BUSINESS_API_ENVIRONMENT_LIVE = 2;
}

message GetBusinessWebhookRequest {
  string business_id = 1;
  BusinessApiEnvironment environment = 2;
}

message BusinessWebhook {
  // False when no URL is set for the environment; every other field is then empty.
  bool configured = 1;
  string url = 2;
  // Plaintext HMAC key. Present whenever configured is true.
  string signing_secret = 3;
  // Event types the owner subscribed to, e.g. "payout.bank.completed". Empty means every event.
  repeated string subscribed_event_types = 4;
  // False when the business may not use the API in this environment (suspended, or live before
  // KYB approval): deliveries are then held rather than sent.
  bool api_access_enabled = 5;
}

// --- Business customers ---

message BusinessCustomer {
  string id = 1;
  string business_id = 2;
  string tenant_id = 3;
  BusinessApiEnvironment environment = 4;
  string first_name = 5;
  string last_name = 6;
  // As given, lower-cased; empty when none.
  string email = 7;
  // E.164; empty when none.
  string phone_number = 8;
  // ISO 3166-1 alpha-2 of where the customer lives; picks the KYC provider.
  string country_iso2 = 9;
  // The caller's own JSON object, verbatim ("{}" by default).
  string meta_json = 10;
  // A BusinessCustomerKycStatus name: "NotStarted", "InProgress", "Approved", "Declined",
  // "ResubmissionRequested", "Expired", "Abandoned" (Compliance's verification statuses).
  string kyc_status = 11;
  // Compliance's current verification session id (or the business API's sandbox id); empty until one opens.
  string kyc_verification_id = 12;
  // ISO 8601; empty until KYC starts.
  string kyc_updated_at = 13;
  // ISO 8601; empty while unverified. Cleared when the address changes.
  string email_verified_at = 14;
  string phone_verified_at = 15;
  // ISO 8601; empty while not archived.
  string archived_at = 16;
  string created_at = 17;
  string updated_at = 18;
  // True once a payment has named the customer: it can then only be archived, never deleted.
  bool has_payments = 19;
}

message CreateBusinessCustomerRequest {
  string business_id = 1;
  BusinessApiEnvironment environment = 2;
  string first_name = 3;
  string last_name = 4;
  string email = 5;
  string phone_number = 6;
  string country_iso2 = 7;
  // Empty means "{}".
  string meta_json = 8;
}

message GetBusinessCustomerRequest {
  string business_id = 1;
  BusinessApiEnvironment environment = 2;
  string customer_id = 3;
}

message ListBusinessCustomersRequest {
  string business_id = 1;
  BusinessApiEnvironment environment = 2;
  // A BusinessCustomerKycStatus name; empty means every status.
  string kyc_status = 3;
  // Exact, case-insensitive; empty means any.
  string email = 4;
  bool include_archived = 5;
  // 1-based; page size is clamped to 1..200.
  int32 page = 6;
  int32 page_size = 7;
}

message ListBusinessCustomersResponse {
  repeated BusinessCustomer customers = 1;
  int64 total_count = 2;
}

// Unset fields are left as they are; a set empty string clears email or phone_number.
message UpdateBusinessCustomerRequest {
  string business_id = 1;
  BusinessApiEnvironment environment = 2;
  string customer_id = 3;
  optional string first_name = 4;
  optional string last_name = 5;
  optional string email = 6;
  optional string phone_number = 7;
  optional string country_iso2 = 8;
  optional string meta_json = 9;
}

message DeleteBusinessCustomerRequest {
  string business_id = 1;
  BusinessApiEnvironment environment = 2;
  string customer_id = 3;
}

message DeleteBusinessCustomerResponse {
}

message ArchiveBusinessCustomerRequest {
  string business_id = 1;
  BusinessApiEnvironment environment = 2;
  string customer_id = 3;
}

message RecordBusinessCustomerKycRequest {
  string business_id = 1;
  BusinessApiEnvironment environment = 2;
  string customer_id = 3;
  string verification_id = 4;
  // A BusinessCustomerKycStatus name.
  string kyc_status = 5;
  // True when verification_id is a new session replacing the current one (a start or a retry);
  // false for a status of the current session, which is ignored if another session is current.
  bool new_session = 6;
}

message MarkBusinessCustomerContactVerifiedRequest {
  string business_id = 1;
  BusinessApiEnvironment environment = 2;
  string customer_id = 3;
  // "email" or "sms".
  string channel = 4;
  // The address the code went to; must still be the customer's (else CONTACT_CHANGED).
  string destination = 5;
}

message ClaimBusinessCustomerForPaymentRequest {
  string business_id = 1;
  BusinessApiEnvironment environment = 2;
  string customer_id = 3;
}
