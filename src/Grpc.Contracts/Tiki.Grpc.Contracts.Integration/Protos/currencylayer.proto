syntax = "proto3";

option csharp_namespace = "Tiki.Grpc.Contracts.Integration";

package tiki.grpc.contracts.integration;

// CurrencyLayer FX-rates mesh API owned by the Integration service.
service CurrencyLayerService {
  rpc GetLiveRates (GetLiveRatesRequest) returns (GetLiveRatesReply);

  // The rate cache's refresh/eviction cadence - runtime-updatable rather than fixed at deploy time.
  rpc GetCacheSettings (GetCacheSettingsRequest) returns (CacheSettingsReply);
  rpc UpdateCacheSettings (UpdateCacheSettingsRequest) returns (CacheSettingsReply);
}

message GetLiveRatesRequest {
  string business_id = 1;
  string tenant_id = 2;
  repeated string currencies = 3;
  optional string source = 4;
}

message GetLiveRatesReply {
  string terms = 1;
  string privacy = 2;
  int64 timestamp = 3;
  string source = 4;
  map<string, double> quotes = 5;
}

message GetCacheSettingsRequest {
}

message UpdateCacheSettingsRequest {
  int32 cache_refresh_minutes = 1;
  int32 cache_eviction_days = 2;
}

message CacheSettingsReply {
  int32 cache_refresh_minutes = 1;
  int32 cache_eviction_days = 2;
}
