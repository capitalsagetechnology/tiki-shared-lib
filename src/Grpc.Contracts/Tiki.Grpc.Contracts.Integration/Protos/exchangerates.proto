syntax = "proto3";

import "Protos/currencylayer.proto";

option csharp_namespace = "Tiki.Grpc.Contracts.Integration";

package tiki.grpc.contracts.integration;

// ExchangeRatesAPI FX-rates mesh API owned by the Integration service. Backed by GET /v1/latest.
// Reuses the live-rates and cache-settings messages defined in currencylayer.proto.
service ExchangeRatesService {
  rpc GetLiveRates (GetLiveRatesRequest) returns (GetLiveRatesReply);

  // The rate cache's refresh/eviction cadence - runtime-updatable rather than fixed at deploy time.
  rpc GetCacheSettings (GetCacheSettingsRequest) returns (CacheSettingsReply);
  rpc UpdateCacheSettings (UpdateCacheSettingsRequest) returns (CacheSettingsReply);
}
