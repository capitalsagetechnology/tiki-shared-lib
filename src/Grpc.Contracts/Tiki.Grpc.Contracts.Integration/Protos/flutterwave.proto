syntax = "proto3";

option csharp_namespace = "Tiki.Grpc.Contracts.Integration";

package tiki.grpc.contracts.integration;

// Flutterwave mesh API owned by the Integration service.
service FlutterwaveService {
  rpc GetBanks (GetBanksRequest) returns (GetBanksReply);
  rpc GetBankBranches (GetBankBranchesRequest) returns (GetBankBranchesReply);
  rpc ResolveAccount (ResolveAccountRequest) returns (ResolveAccountReply);
  rpc InitiateTransfer (InitiateTransferRequest) returns (TransferReply);
  rpc RetryTransfer (RetryTransferRequest) returns (TransferReply);
  rpc GetTransferStatus (GetTransferStatusRequest) returns (TransferReply);
  // Standard Checkout: POST /v3/payments. A collection, not a payout - money coming in from a
  // customer, paid against the hosted link this returns, not money going out to a bank account.
  rpc InitiatePayment (InitiatePaymentRequest) returns (PaymentLinkReply);
  rpc VerifyTransactionById (VerifyTransactionByIdRequest) returns (TransactionVerifyReply);
  rpc VerifyTransactionByReference (VerifyTransactionByReferenceRequest) returns (TransactionVerifyReply);
  rpc RefundTransaction (RefundTransactionRequest) returns (FlutterwaveRefundReply);
  rpc GetRefund (GetRefundRequest) returns (FlutterwaveRefundReply);
  rpc ResendFailedWebhook (ResendFailedWebhookRequest) returns (ResendFailedWebhookReply);
}

message GetBanksRequest {
  string business_id = 1;
  string tenant_id = 2;
  string country_code = 3;
}

message BankSummary {
  int32 id = 1;
  string code = 2;
  string name = 3;
}

message GetBanksReply {
  repeated BankSummary banks = 1;
}

message GetBankBranchesRequest {
  string business_id = 1;
  string tenant_id = 2;
  int32 bank_id = 3;
}

message BankBranchSummary {
  int32 id = 1;
  string branch_code = 2;
  string branch_name = 3;
  string swift_code = 4;
  string bic = 5;
  int32 bank_id = 6;
}

message GetBankBranchesReply {
  repeated BankBranchSummary branches = 1;
}

message ResolveAccountRequest {
  string business_id = 1;
  string tenant_id = 2;
  string account_number = 3;
  string account_bank = 4;
  string country = 5;
}

message ResolveAccountReply {
  bool is_valid = 1;
  string account_number = 2;
  string account_name = 3;
  string error_message = 4;
}

message InitiateTransferRequest {
  string business_id = 1;
  string tenant_id = 2;
  InitiateTransferPayout payout = 3;
}

message InitiateTransferPayout {
  string amount = 1;
  string currency = 2;
  string account_bank = 3;
  string account_number = 4;
  string debit_sub_account = 5;
  string narration = 6;
  string reference = 7;
  string debit_currency = 8;
  string destination_branch_code = 9;
  string beneficiary_name = 10;
  string call_back_url = 11;
  string meta_json = 12;
}

message InitiatePaymentRequest {
  string business_id = 1;
  string tenant_id = 2;
  PaymentDetails payment = 3;
}

message PaymentDetails {
  string amount = 1;
  string currency = 2;
  // Merchant reference. Optional - the handler generates one (same TX-{guid} convention as a
  // transfer's own Reference) when left empty.
  string tx_ref = 3;
  string redirect_url = 4;
  PaymentCustomer customer = 5;
  PaymentCustomizations customizations = 6;
  string meta_json = 7;
  // Which payment methods the hosted checkout offers - Flutterwave's own "payment_options" field,
  // a comma-separated string in their API but modeled here as a real enum for now, one value per
  // method the caller wants enabled (empty means "whatever the merchant account has enabled by
  // default"). This is deliberately a fixed enum, not an open string list - a future admin-facing
  // rpc is planned to let staff manage the available set directly instead of each caller guessing
  // valid values, at which point this may become a lookup by code rather than a compiled enum.
  repeated FlutterwavePaymentMethod payment_methods = 8;
}

enum FlutterwavePaymentMethod {
  FLUTTERWAVE_PAYMENT_METHOD_UNSPECIFIED = 0;
  FLUTTERWAVE_PAYMENT_METHOD_CARD = 1;
  FLUTTERWAVE_PAYMENT_METHOD_USSD = 2;
  FLUTTERWAVE_PAYMENT_METHOD_BANK_TRANSFER = 3;
  FLUTTERWAVE_PAYMENT_METHOD_ACCOUNT = 4;
  FLUTTERWAVE_PAYMENT_METHOD_MOBILE_MONEY_GHANA = 5;
  FLUTTERWAVE_PAYMENT_METHOD_MOBILE_MONEY_RWANDA = 6;
  FLUTTERWAVE_PAYMENT_METHOD_MOBILE_MONEY_UGANDA = 7;
  FLUTTERWAVE_PAYMENT_METHOD_MOBILE_MONEY_ZAMBIA = 8;
  FLUTTERWAVE_PAYMENT_METHOD_MOBILE_MONEY_FRANCOPHONE_AFRICA = 9;
  FLUTTERWAVE_PAYMENT_METHOD_BARTER = 10;
}

message PaymentCustomer {
  string email = 1;
  string phone_number = 2;
  string name = 3;
}

message PaymentCustomizations {
  string title = 1;
  string logo = 2;
}

message PaymentLinkReply {
  string link = 1;
  // Echoes back whichever reference was actually used - the caller's own, or the generated one
  // when none was supplied - since Flutterwave's own /v3/payments response never returns tx_ref.
  string tx_ref = 2;
}

message RetryTransferRequest {
  int32 transfer_id = 1;
  string business_id = 2;
  string tenant_id = 3;
}

message GetTransferStatusRequest {
  int32 transfer_id = 1;
  string business_id = 2;
  string tenant_id = 3;
}

message TransferReply {
  int32 transfer_id = 1;
  string status = 2;
  string fee = 3;
  string reference = 4;
  string complete_message = 5;
  string account_number = 6;
  string bank_code = 7;
  string bank_name = 8;
  string full_name = 9;
  string created_at = 10;
  string currency = 11;
  string debit_currency = 12;
  string amount = 13;
  string narration = 14;
  int32 requires_approval = 15;
  int32 is_approved = 16;
  string approver = 17;
  map<string, string> meta = 18;
}

message VerifyTransactionByIdRequest {
  string business_id = 1;
  string tenant_id = 2;
  int32 transaction_id = 3;
}

message VerifyTransactionByReferenceRequest {
  string business_id = 1;
  string tenant_id = 2;
  string tx_ref = 3;
}

message TransactionVerifyReply {
  int32 transaction_id = 1;
  string status = 2;
  string amount = 3;
  string currency = 4;
  string app_fee = 5;
  string tx_ref = 6;
  string flw_ref = 7;
  string device_fingerprint = 8;
  string charged_amount = 9;
  string merchant_fee = 10;
  string processor_response = 11;
  string auth_model = 12;
  string ip = 13;
  string narration = 14;
  string payment_type = 15;
  string created_at = 16;
  int32 account_id = 17;
  string amount_settled = 18;
  TransactionCard card = 19;
  TransactionCustomer customer = 20;
  map<string, string> meta = 21;
}

message TransactionCard {
  string first_6digits = 1;
  string last_4digits = 2;
  string issuer = 3;
  string country = 4;
  string type = 5;
  string token = 6;
  string expiry = 7;
}

message TransactionCustomer {
  int32 id = 1;
  string name = 2;
  string phone_number = 3;
  string email = 4;
  string created_at = 5;
}

message RefundTransactionRequest {
  string business_id = 1;
  string tenant_id = 2;
  int32 transaction_id = 3;
  int32 amount = 4;
  string comments = 5;
  string callback_url = 6;
}

message GetRefundRequest {
  string business_id = 1;
  string tenant_id = 2;
  int32 refund_id = 3;
}

message FlutterwaveRefundReply {
  int32 refund_id = 1;
  int32 transaction_id = 2;
  string amount_refunded = 3;
  string status = 4;
  string destination = 5;
  string comments = 6;
  string created_at = 7;
  string flw_ref = 8;
  string settlement_id = 9;
  int32 account_id = 10;
  map<string, string> meta = 11;
  int32 wallet_id = 12;
}

message ResendFailedWebhookRequest {
  string business_id = 1;
  string tenant_id = 2;
  int32 transaction_id = 3;
  int32 wait = 4;
}

message ResendFailedWebhookReply {
  string status = 1;
  string message = 2;
  optional string data_json = 3;
}
