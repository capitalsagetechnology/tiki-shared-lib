syntax = "proto3";

option csharp_namespace = "Tiki.Grpc.Contracts.Integration";

package tiki.grpc.contracts.integration;

// KYCAID mesh API owned by the Integration service. Sibling providers live in their own
// proto files in this package (veriff.proto, flutterwave.proto, volume.proto, smartcomply.proto).
// Callers compile against this package; they never talk to KYCAID (or any other provider) directly.
service KycaidService {
  rpc GetBusinessActivities (GetBusinessActivitiesRequest) returns (GetBusinessActivitiesReply);

  rpc CreateApplicant (CreateApplicantRequest) returns (ApplicantReply);
  rpc GetApplicant (GetApplicantRequest) returns (ApplicantDetailsReply);
  rpc UpdateApplicant (UpdateApplicantRequest) returns (ApplicantDetailsReply);

  rpc CreateAddress (CreateAddressRequest) returns (AddressReply);
  rpc UpdateAddress (UpdateAddressRequest) returns (AddressReply);
  rpc DeleteAddress (DeleteAddressRequest) returns (AddressReply);

  rpc CreateAffiliatedPerson (CreateAffiliatedPersonRequest) returns (AffiliatedPersonReply);
  rpc UpdateAffiliatedPerson (UpdateAffiliatedPersonRequest) returns (AffiliatedPersonReply);
  rpc DeleteAffiliatedPerson (DeleteAffiliatedPersonRequest) returns (AffiliatedPersonReply);

  rpc CreateFile (CreateFileRequest) returns (FileReply);
  rpc UpdateFile (UpdateFileRequest) returns (FileReply);

  rpc CreateDocument (CreateDocumentRequest) returns (DocumentReply);
  rpc GetDocument (GetDocumentRequest) returns (DocumentDetailsReply);
  rpc UpdateDocument (UpdateDocumentRequest) returns (DocumentReply);
  rpc DeleteDocument (DeleteDocumentRequest) returns (DocumentReply);

  rpc CreateVerification (CreateVerificationRequest) returns (VerificationReply);
  rpc GetVerification (GetVerificationRequest) returns (VerificationDecisionReply);
  rpc UpdateVerificationStatus (UpdateVerificationStatusRequest) returns (VerificationStatusReply);
  rpc GetVerificationReport (GetVerificationReportRequest) returns (VerificationReportReply);
  rpc GetVerificationsReport (GetVerificationsReportRequest) returns (GetVerificationsReportReply);

  rpc CreateAdverseMediaCheck (CreateAdverseMediaCheckRequest) returns (AdverseMediaCheckReply);
  rpc SearchBlacklistPersons (SearchBlacklistPersonsRequest) returns (SearchBlacklistPersonsReply);
  rpc SearchBlacklistDocuments (SearchBlacklistDocumentsRequest) returns (SearchBlacklistDocumentsReply);
  rpc SearchBlacklistTaxIds (SearchBlacklistTaxIdsRequest) returns (SearchBlacklistTaxIdsReply);
}

// ---- business activities -----------------------------------------------------------------

message GetBusinessActivitiesRequest {
  string business_id = 1;
  string tenant_id = 2;
}

message Label {
  string label = 1;
  string language_code = 2;
}

message BusinessActivity {
  string business_activity_id = 1;
  repeated Label labels = 2;
}

message BusinessCategory {
  string business_category_id = 1;
  repeated Label labels = 2;
  repeated BusinessActivity activities = 3;
}

message GetBusinessActivitiesReply {
  repeated BusinessCategory categories = 1;
}

// ---- applicants -----------------------------------------------------------------------------

message CreateApplicantRequest {
  string business_id = 1;
  string tenant_id = 2;
  string type = 3;
  string first_name = 4;
  string middle_name = 5;
  string last_name = 6;
  string date_of_birth = 7;
  string gender = 8;
  bool pep = 9;
  string residence_country = 10;
  string nationality = 11;
  string company_name = 12;
  string business_activity_id = 13;
  string registration_country = 14;
  string email = 15;
  string phone_number = 16;
  string telegram_username = 17;
  string wallet_address = 18;
  string external_applicant_id = 19;
  string custom_field_1 = 20;
  string custom_field_2 = 21;
  string custom_field_3 = 22;
  string custom_field_4 = 23;
  string custom_field_5 = 24;
}

message ApplicantReply {
  string applicant_id = 1;
}

message GetApplicantRequest {
  string business_id = 1;
  string tenant_id = 2;
  string applicant_id = 3;
}

message UpdateApplicantRequest {
  string business_id = 1;
  string tenant_id = 2;
  string applicant_id = 3;
  string first_name = 4;
  string middle_name = 5;
  string last_name = 6;
  string date_of_birth = 7;
  string gender = 8;
  bool pep = 9;
  string residence_country = 10;
  string nationality = 11;
  string email = 12;
  string phone_number = 13;
  string telegram_username = 14;
  string wallet_address = 15;
  string external_applicant_id = 16;
  string custom_field_1 = 17;
  string custom_field_2 = 18;
  string custom_field_3 = 19;
  string custom_field_4 = 20;
  string custom_field_5 = 21;
}

message ApplicantDetailsReply {
  string applicant_id = 1;
  string external_applicant_id = 2;
  string type = 3;
  string created_at = 4;
  string profile_status = 5;
  string profile_comment = 6;
  string first_name = 7;
  string origin_first_name = 8;
  string middle_name = 9;
  string origin_middle_name = 10;
  string last_name = 11;
  string origin_last_name = 12;
  string residence_country = 13;
  string nationality = 14;
  string company_name = 15;
  string business_activity_id = 16;
  string registration_country = 17;
  string date_of_birth = 18;
  string gender = 19;
  string email = 20;
  string phone_number = 21;
  string phone_status = 22;
  string wallet_address = 23;
  string telegram_username = 24;
  bool pep = 25;
  string custom_field_1 = 26;
  string custom_field_2 = 27;
  string custom_field_3 = 28;
  string custom_field_4 = 29;
  string custom_field_5 = 30;
  repeated string decline_reasons = 31;
  int32 verifications_count = 32;
}

// ---- addresses ------------------------------------------------------------------------------

message CreateAddressRequest {
  string business_id = 1;
  string tenant_id = 2;
  string applicant_id = 3;
  string affiliated_person_id = 4;
  string type = 5;
  string full_address = 6;
  string country = 7;
  string state = 8;
  string region = 9;
  string province = 10;
  string city = 11;
  string district = 12;
  string address = 13;
  string postal_code = 14;
  string street_name = 15;
  string building_number = 16;
  string unit_number = 17;
}

message UpdateAddressRequest {
  string business_id = 1;
  string tenant_id = 2;
  string address_id = 3;
  string type = 4;
  string full_address = 5;
  string country = 6;
  string state = 7;
  string region = 8;
  string province = 9;
  string city = 10;
  string district = 11;
  string address = 12;
  string postal_code = 13;
  string street_name = 14;
  string building_number = 15;
  string unit_number = 16;
}

message DeleteAddressRequest {
  string business_id = 1;
  string tenant_id = 2;
  string address_id = 3;
}

message AddressReply {
