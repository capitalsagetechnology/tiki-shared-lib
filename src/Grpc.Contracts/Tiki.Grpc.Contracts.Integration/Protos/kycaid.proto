}

// ---- files ------------------------------------------------------------------------------------

message CreateFileRequest {
  string business_id = 1;
  string tenant_id = 2;
  bytes file_content = 3;
  string file_name = 4;
  string content_type = 5;
}

message UpdateFileRequest {
  string business_id = 1;
  string tenant_id = 2;
  string file_id = 3;
  bytes file_content = 4;
  string file_name = 5;
  string content_type = 6;
}

message FileReply {
  string file_id = 1;
}

// ---- documents ----------------------------------------------------------------------------

