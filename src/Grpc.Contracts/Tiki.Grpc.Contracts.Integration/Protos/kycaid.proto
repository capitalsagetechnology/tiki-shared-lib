// ---- verifications -----------------------------------------------------------------------

message CreateVerificationRequest {
  string business_id = 1;
  string tenant_id = 2;
  string applicant_id = 3;
  string form_id = 4;
  string language_code = 5;
}

message VerificationReply {
  string verification_id = 1;
}

message GetVerificationRequest {
  string verification_id = 1;
  string business_id = 2;
  string tenant_id = 3;
}

message VerificationCheckResult {
  string status = 1;
  bool verified = 2;
}

message VerificationDecisionReply {
  string verification_id = 1;
  string applicant_id = 2;
  string status = 3;
  bool verified = 4;
  map<string, VerificationCheckResult> verifications = 5;
}

message UpdateVerificationStatusRequest {
  string verification_id = 1;
  string verification_status = 2;
  bool callback_enabled = 3;
  bool project_owner_email_enabled = 4;
  bool applicant_email_enabled = 5;
  string business_id = 6;
  string tenant_id = 7;
}

message VerificationStatusReply {
  string verification_id = 1;
  string verification_status = 2;
}

message GetVerificationReportRequest {
  string business_id = 1;
  string tenant_id = 2;
  string verification_id = 3;
}

message VerificationReportReply {
  string report_url = 1;
}

message GetVerificationsReportRequest {
  string business_id = 1;
  string tenant_id = 2;
  string date = 3;
  int32 offset = 4;
  int32 count = 5;
}

message VerificationsReportEntry {
  string created_at = 1;
  string verification_id = 2;
  string applicant_id = 3;
  string external_applicant_id = 4;
  string form_id = 5;
  string status = 6;
  string service = 7;
  string method = 8;
  string name = 9;
  string date_of_birth = 10;
  string country_code = 11;
  string tax_id_number = 12;
  string email = 13;
  string phone_number = 14;
  string wallet_address = 15;
  string telegram_username = 16;
  repeated string verification_types = 17;
  repeated string decline_reasons = 18;
  int32 processing_time = 19;
  string price = 20;
  string mode = 21;
}

message GetVerificationsReportReply {
  repeated VerificationsReportEntry entries = 1;
}

// ---- adverse media & blacklist checks -----------------------------------------------------

message CreateAdverseMediaCheckRequest {
  string business_id = 1;
  string tenant_id = 2;
  repeated string primary_keywords = 3;
  repeated string secondary_keywords = 4;
  string callback_url = 5;
}

message AdverseMediaCheckReply {
  repeated string primary_keywords = 1;
  repeated string secondary_keywords = 2;
  string callback_url = 3;
}

message SearchBlacklistPersonsRequest {
  string business_id = 1;
  string tenant_id = 2;
  string full_name = 3;
  string first_name = 4;
  string last_name = 5;
  string middle_name = 6;
  string date_of_birth = 7;
  string residence_country = 8;
  string gender = 9;
  string name_match_threshold = 10;
  string name_match_weight = 11;
  bool dob_match_enabled = 12;
  string dob_match_weight = 13;
  bool residence_country_match_enabled = 14;
  string residence_country_match_weight = 15;
  bool gender_match_enabled = 16;
  string gender_match_weight = 17;
  repeated string bdb_types = 18;
}

message BlacklistSearchParameters {
  string name_match_threshold = 1;
  string name_match_weight = 2;
  bool dob_match_enabled = 3;
  string dob_match_weight = 4;
  bool residence_country_match_enabled = 5;
  string residence_country_match_weight = 6;
  bool gender_match_enabled = 7;
  string gender_match_weight = 8;
}

message BlacklistPersonMatch {
  string full_name = 1;
  string origin_full_name = 2;
  string first_name = 3;
  string origin_first_name = 4;
  string last_name = 5;
  string origin_last_name = 6;
  string middle_name = 7;
  string origin_middle_name = 8;
  string date_of_birth = 9;
  string residence_country = 10;
  string gender = 11;
  string description = 12;
  string bdb_name = 13;
  repeated string aliases = 14;
  repeated string addresses = 15;
  string name_match_score = 16;
  string total_match_score = 17;
}

message SearchBlacklistPersonsReply {
  BlacklistSearchParameters parameters = 1;
  repeated BlacklistPersonMatch matches = 2;
}

message SearchBlacklistDocumentsRequest {
  string business_id = 1;
  string tenant_id = 2;
  string document_number = 3;
  string document_type = 4;
  string document_country = 5;
  repeated string bdb_types = 6;
}

message BlacklistDocumentMatch {
  string document_number = 1;
  string document_type = 2;
  string document_country = 3;
  string description = 4;
  string bdb_name = 5;
  repeated string bdb_type = 6;
}

message SearchBlacklistDocumentsReply {
  repeated BlacklistDocumentMatch matches = 1;
}

message SearchBlacklistTaxIdsRequest {
  string business_id = 1;
  string tenant_id = 2;
  string tax_id_number = 3;
  string tax_id_country = 4;
  repeated string bdb_types = 5;
}

message BlacklistTaxIdMatch {
  string full_name = 1;
  string origin_full_name = 2;
  string first_name = 3;
  string origin_first_name = 4;
  string last_name = 5;
  string origin_last_name = 6;
  string middle_name = 7;
  string origin_middle_name = 8;
  string residence_country = 9;
  string date_of_birth = 10;
  string gender = 11;
  string description = 12;
  string bdb_name = 13;
  repeated string bdb_type = 14;
  int32 accuracy = 15;
}

message SearchBlacklistTaxIdsReply {
  repeated BlacklistTaxIdMatch matches = 1;
}
