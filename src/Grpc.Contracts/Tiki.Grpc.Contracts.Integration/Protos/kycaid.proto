}

// ---- affiliated persons -----------------------------------------------------------------------

message CreateAffiliatedPersonRequest {
  string business_id = 1;
  string tenant_id = 2;
  string type = 3;
  string applicant_id = 4;
  string first_name = 5;
  string last_name = 6;
  string title = 7;
  string share = 8;
  string date_of_birth = 9;
  string residence_country = 10;
  string nationality = 11;
  string email = 12;
}

message UpdateAffiliatedPersonRequest {
  string business_id = 1;
  string tenant_id = 2;
  string affiliated_person_id = 3;
  string first_name = 4;
  string last_name = 5;
  string title = 6;
  string share = 7;
  string date_of_birth = 8;
  string residence_country = 9;
  string nationality = 10;
  string email = 11;
}

message DeleteAffiliatedPersonRequest {
  string business_id = 1;
  string tenant_id = 2;
  string affiliated_person_id = 3;
}

message AffiliatedPersonReply {
