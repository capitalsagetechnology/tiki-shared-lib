  string affiliated_person_id = 4;
  string type = 5;
  string document_number = 6;
  string additional_number = 7;
  string issue_date = 8;
  string expiry_date = 9;
  string issuing_authority = 10;
  string card_number = 11;
  string account_number = 12;
  repeated string income_sources = 13;
  string annual_income = 14;
  string transaction_amount = 15;
  string transaction_currency = 16;
  string transaction_datetime = 17;
  string transaction_purpose = 18;
  string origin_funds = 19;
  string front_side_id = 20;
  string back_side_id = 21;
  string other_side_1_id = 22;
  string other_side_2_id = 23;
  string other_side_3_id = 24;
}

message GetDocumentRequest {
  string business_id = 1;
  string tenant_id = 2;
  string document_id = 3;
}

message UpdateDocumentRequest {
  string business_id = 1;
  string tenant_id = 2;
  string document_id = 3;
  string type = 4;
  string document_number = 5;
  string additional_number = 6;
  string issue_date = 7;
  string expiry_date = 8;
  string issuing_authority = 9;
  repeated string income_sources = 10;
  string annual_income = 11;
  string transaction_amount = 12;
  string transaction_currency = 13;
  string transaction_datetime = 14;
  string transaction_purpose = 15;
  string origin_funds = 16;
  string card_number = 17;
  string account_number = 18;
  string front_side_id = 19;
  string back_side_id = 20;
  string other_side_1_id = 21;
  string other_side_2_id = 22;
  string other_side_3_id = 23;
}

message DeleteDocumentRequest {
  string business_id = 1;
  string tenant_id = 2;
  string document_id = 3;
}

message DocumentReply {
