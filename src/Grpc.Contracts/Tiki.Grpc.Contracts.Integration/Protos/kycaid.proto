  string type = 4;
  string provider = 5;
  string status = 6;
  string comment = 7;
  string document_number = 8;
  string additional_number = 9;
  string issue_date = 10;
  string expiry_date = 11;
  string issuing_authority = 12;
  repeated string income_sources = 13;
  string annual_income = 14;
  string transaction_amount = 15;
  string transaction_currency = 16;
  string transaction_datetime = 17;
  string transaction_purpose = 18;
  string origin_funds = 19;
  string card_number = 20;
  string account_number = 21;
  string portrait = 22;
  string front_side_id = 23;
  string front_side = 24;
  string back_side_id = 25;
  string back_side = 26;
  string other_side_1_id = 27;
  string other_side_1 = 28;
  string other_side_2_id = 29;
  string other_side_2 = 30;
