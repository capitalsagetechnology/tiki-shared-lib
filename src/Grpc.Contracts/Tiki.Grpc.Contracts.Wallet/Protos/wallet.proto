syntax = "proto3";

option csharp_namespace = "Tiki.Grpc.Contracts.Wallet";

package tiki.grpc.contracts.wallet;

// Placeholder contract — real RPCs to follow. Owning service: Wallet.
service WalletService {
  rpc Ping (PingRequest) returns (PingResponse);
}

message PingRequest {
}

message PingResponse {
  bool ok = 1;
}

// Lets an operator pin a specific payout provider for a route instead of leaving it to Wallet's
// default selection order. Owning service: Wallet.
service PayoutRoutingService {
  rpc SetPreferredProvider (SetPreferredProviderRequest) returns (SetPreferredProviderResponse);
  rpc GetPreferredProvider (GetPreferredProviderRequest) returns (GetPreferredProviderResponse);
}

message SetPreferredProviderRequest {
  // ISO 3166-1 alpha-2, upper case (e.g. "NG", "US"). Wallet normalizes on receipt, but a caller
  // that sends a different case or format for the same route mints a second, silently-distinct
  // route key - always send the canonical form.
  string source_country = 1;
  string destination_country = 2;
  // ISO 4217 alpha-3, upper case (e.g. "USD", "NGN") - the same convention Wallet's FX code
  // already uses elsewhere (see FxRateService.Normalize).
  string currency_code = 3;
  // A registered IPayoutProvider.Name, e.g. "flutterwave", "corpay" - lower case, ASCII,
  // hyphen-separated. Case-sensitive: a provider is registered under exactly one name.
  string preferred_provider_name = 4;
}

message SetPreferredProviderResponse {
}

message GetPreferredProviderRequest {
  // Same ISO 3166-1 alpha-2 / upper-case rule as SetPreferredProviderRequest.
  string source_country = 1;
  string destination_country = 2;
  // Same ISO 4217 alpha-3 / upper-case rule as SetPreferredProviderRequest.
  string currency_code = 3;
}

message GetPreferredProviderResponse {
  // Empty when no provider has been pinned for this route.
  string preferred_provider_name = 1;
}

// The business API's window onto Wallet. Owning service: Wallet. Called only by tiki-business-api,
// on behalf of a business that authenticated with an API key — there is no user and no session, so
// every RPC names its business explicitly and Wallet authorises by that business alone.
//
// Tenant: when the business has a live wallet owner row, that row's tenant is used and a
// disagreeing X-Tenant-Id is ignored (and logged). When it has none yet — a business still in KYB
// integrating against sandbox — Wallet uses the tenant business-api sends, which the gateway
// resolved from the verified API key. The service signature covers only the method name, so the
// request body and the headers are equally caller-asserted: the trust boundary is the caller, and
// Wallet accepts no caller but business-api here.
//
// Amounts are decimal strings in invariant culture ("1234.50"), never floats: a double cannot hold
// every amount a ledger can. Timestamps are ISO 8601 UTC strings, as in identity.proto.
service BusinessApiService {
  // The business's spendable accounts, one per currency. In SANDBOX, Wallet provisions the
  // business's sandbox accounts on first use and funds them with test money; sandbox and live
  // accounts are separate ledgers and never appear in each other's answers.
  rpc ListAccounts (ListBusinessAccountsRequest) returns (ListBusinessAccountsResponse);

  // Ledger lines on the business's accounts, newest first.
  rpc ListLedgerEntries (ListBusinessLedgerEntriesRequest) returns (ListBusinessLedgerEntriesResponse);

  // The rate this business would get for each pair right now, through Wallet's FX pricing — the
  // business's negotiated rate where one applies. Pairs Wallet cannot price are left out of the
  // answer rather than failing the call.
  rpc GetEffectiveRates (GetEffectiveRatesRequest) returns (GetEffectiveRatesResponse);

  // Banks a payout can reach in a country. MX answers from the SPEI directory, others from the
  // bank-transfer provider.
  rpc ListBanks (ListBanksRequest) returns (ListBanksResponse);

  // Mobile-money networks a payout can reach. Empty currency means every supported currency.
  rpc ListMobileMoneyNetworks (ListMobileMoneyNetworksRequest) returns (ListMobileMoneyNetworksResponse);

  // Asks the bank-transfer provider who holds an account, before money is sent to it.
  rpc ValidateBankAccount (ValidateBankAccountRequest) returns (ValidateBankAccountResponse);

  // --- Money out -------------------------------------------------------------------------------
  //
  // A payment debits the business's account for the environment and pays one destination through
  // the Compliance payout route for (country, rail). There is no emailed authorisation step: an API
  // key is a machine caller, so instead Wallet enforces the business's API limits and refuses
  // anything above them. Sandbox payments are paid by a mock provider from sandbox money only.
  //
  // Failures are gRPC statuses carrying a machine-readable code in the "tiki-error-code" trailer:
  //   INVALID_ARGUMENT     INVALID_REQUEST, INVALID_DESTINATION, INVALID_AMOUNT
  //   FAILED_PRECONDITION  INSUFFICIENT_FUNDS, LIMIT_EXCEEDED, ROUTE_NOT_SUPPORTED,
  //                        CURRENCY_NOT_SUPPORTED, BUSINESS_NOT_ACTIVE, QUOTE_FAILED,
  //                        CUSTOMER_NOT_FOUND, CUSTOMER_NOT_VERIFIED, CUSTOMER_ARCHIVED
  //   ALREADY_EXISTS       REFERENCE_CONFLICT (same client_reference, different request)
  //   NOT_FOUND            PAYMENT_NOT_FOUND

  // Idempotent on (business_id, environment, client_reference): the same reference with the same
  // request returns the existing payment and debits nothing; with a different request it is
  // REFERENCE_CONFLICT.
  rpc CreatePayment (CreateBusinessPaymentRequest) returns (BusinessPayment);

  // By payment id or by client_reference, within the business and environment.
  rpc GetPayment (GetBusinessPaymentRequest) returns (BusinessPayment);

  // Newest first.
  rpc ListPayments (ListBusinessPaymentsRequest) returns (ListBusinessPaymentsResponse);

  // --- Sandbox ---------------------------------------------------------------------------------

  // Credits the business's SANDBOX account in `currency` with test money, as if a pay-in had
  // arrived on `rail` — the business API's payment/simulate-funding. Sandbox only by construction:
  // there is no environment field, and no live account is ever touched. Idempotent on
  // (business_id, reference): the same reference credits once and returns the first result.
  rpc SimulateSandboxFunding (SimulateSandboxFundingRequest) returns (SimulateSandboxFundingResponse);

  // --- Sub-accounts (sub-ledgers of the business) ------------------------------------------------
  //
  // Additional codes in the "tiki-error-code" trailer:
  //   FAILED_PRECONDITION  SUBACCOUNT_NOT_EMPTY, CURRENCY_NOT_SUPPORTED
  //   NOT_FOUND            SUBACCOUNT_WALLET_NOT_FOUND

  // Opens the sub-account's accounts in these currencies (idempotent: existing ones are returned
  // as they are). Returns every account the sub-account holds in the environment.
  rpc OpenSubAccountWallets (OpenSubAccountWalletsRequest) returns (ListBusinessAccountsResponse);

  // Closes every account of the sub-account in the environment. Refused with SUBACCOUNT_NOT_EMPTY
  // while any of them holds money.
  rpc CloseSubAccountWallets (CloseSubAccountWalletsRequest) returns (CloseSubAccountWalletsResponse);

  // Prices a move between two of the business's own accounts (main ↔ sub-account, or sub ↔ sub),
  // converting through FX pricing at the business's rate when the currencies differ. Moves nothing.
  rpc QuoteInternalTransfer (InternalTransferRequest) returns (InternalTransferQuote);

  // Moves money between two of the business's own accounts in one environment. Idempotent on
  // (business_id, environment, client_reference) like CreatePayment. Not a payout: nothing leaves
  // the business, so API limits do not apply.
  rpc CreateInternalTransfer (InternalTransferRequest) returns (InternalTransfer);

  // --- Pay-ins (money in) -----------------------------------------------------------------------
  //
  // A pay-in asks a payer to send the business money through a provider (Interac request-money
  // for CAD, a Flutterwave card/bank link for NGN) and credits the business's main account — or
  // the given sub-account — when the provider confirms it. Settlement reuses Wallet's deposit
  // path, so a payment that arrives after the pay-in expired or was cancelled is still credited:
  // money that arrived is never dropped. Sandbox pay-ins call no provider and stay Pending until
  // SimulatePayIn decides them.
  //
  // Additional codes in the "tiki-error-code" trailer:
  //   INVALID_ARGUMENT     METHOD_NOT_SUPPORTED
  //   FAILED_PRECONDITION  PAYIN_NOT_CANCELLABLE, PROVIDER_DECLINED
  //   NOT_FOUND            PAYIN_NOT_FOUND

  // Idempotent on (business_id, environment, client_reference), like CreatePayment.
  rpc CreatePayIn (CreatePayInRequest) returns (PayIn);
  rpc GetPayIn (GetPayInRequest) returns (PayIn);
  // Newest first.
  rpc ListPayIns (ListPayInsRequest) returns (ListPayInsResponse);
  // Pending only. The provider's request is left to lapse; a late payment still settles as Paid.
  rpc CancelPayIn (CancelPayInRequest) returns (PayIn);
  // Sandbox pay-ins only: decides a Pending pay-in as the payer's provider would have.
  rpc SimulatePayIn (SimulatePayInRequest) returns (PayIn);
  // Where to send a bank transfer or Interac e-Transfer by hand — no pay-in is created and nothing
  // is tracked; the credit arrives through the Console's approval flow. Live values; in SANDBOX
  // the answer is a clearly marked sample.
  rpc GetPayInInstructions (GetPayInInstructionsRequest) returns (PayInInstructions);

  // --- Reference data (continued) -----------------------------------------------------------------

  // Branches of a bank from ListBanks (by its numeric id), for countries whose bank transfers need
  // a branch code. Empty when the provider has none for that bank.
  rpc ListBankBranches (ListBankBranchesRequest) returns (ListBankBranchesResponse);

  // What Tiki would charge on an amount for a rail and direction, from the pricing Wallet actually
  // applies — so it can honestly be zero where nothing is charged (business payouts today carry only
  // the FX spread). rail_fee is what the provider charges on top, where known.
  rpc EstimateFees (EstimateFeesRequest) returns (FeeEstimate);
}

enum BusinessApiEnvironment {
  BUSINESS_API_ENVIRONMENT_UNSPECIFIED = 0;
  BUSINESS_API_ENVIRONMENT_SANDBOX = 1;
  BUSINESS_API_ENVIRONMENT_LIVE = 2;
}

message ListBusinessAccountsRequest {
  string business_id = 1;
  BusinessApiEnvironment environment = 2;
  // Empty: the business's main accounts. Set: that sub-account's accounts only. Sub-accounts are
  // sub-ledgers of the business's own funds (the business stays the customer); Wallet partitions
  // by this id and never validates it — tiki-business-api owns sub-account profiles.
  string sub_account_id = 3;
}

message BusinessAccount {
  // The ledger account — the stable id of "this business's money in this currency".
  string account_id = 1;
  // ISO 4217 alpha-3, upper case.
  string currency_code = 2;
  string balance = 3;
  string account_number = 4;
  bool is_active = 5;
  // Empty for a tenant that keeps business money on the ledger without a wallet.
  string wallet_id = 6;
  string wallet_account_id = 7;
  // Empty for a main account.
  string sub_account_id = 8;
}

message ListBusinessAccountsResponse {
  repeated BusinessAccount accounts = 1;
}

message ListBusinessLedgerEntriesRequest {
  string business_id = 1;
  BusinessApiEnvironment environment = 2;
  // Empty means every account the business holds in this environment.
  string account_id = 3;
  // ISO 4217; empty means every currency.
  string currency_code = 4;
  // ISO 8601; empty means unbounded.
  string from = 5;
  string to = 6;
  // 1-based. Page size is clamped to 1..200 by Wallet.
  int32 page = 7;
  int32 page_size = 8;
  // Empty: main accounts (ignored when account_id is set). Set: that sub-account's accounts.
  string sub_account_id = 9;
}

message BusinessLedgerEntry {
  string id = 1;
  string posted_at = 2;
  // "Debit" or "Credit", from the business's side.
  string direction = 3;
  string amount = 4;
  string currency_code = 5;
  string balance_before = 6;
  string balance_after = 7;
  // A LedgerTransactionType name, e.g. "PayoutReservation", "PayIn".
  string type = 8;
  string description = 9;
  string reference = 10;
  string account_id = 11;
}

message ListBusinessLedgerEntriesResponse {
  repeated BusinessLedgerEntry entries = 1;
  int64 total_count = 2;
}

message CurrencyPair {
  // ISO 4217 alpha-3, upper case. The rate answers "one base buys how much quote".
  string base_currency = 1;
  string quote_currency = 2;
}

message GetEffectiveRatesRequest {
  string business_id = 1;
  repeated CurrencyPair pairs = 2;
}

message EffectiveRate {
  string base_currency = 1;
  string quote_currency = 2;
  // The rate the business gets, markup included.
  string rate = 3;
  string retrieved_at = 4;
  string expires_at = 5;
}

message GetEffectiveRatesResponse {
  repeated EffectiveRate rates = 1;
}

message ListBanksRequest {
  // ISO 3166-1 alpha-2, upper case.
  string country_code = 1;
}

message Bank {
  // Numeric where the provider has one; 0 where it does not (SPEI).
  int32 id = 1;
  string code = 2;
  string name = 3;
}

message ListBanksResponse {
  repeated Bank banks = 1;
}

message ListMobileMoneyNetworksRequest {
  // ISO 4217; empty means every currency Wallet can pay out by mobile money.
  string currency_code = 1;
}

message MobileMoneyNetwork {
  // The network code a payout names, e.g. "MPS", "MTN".
  string code = 1;
  string name = 2;
  string currency_code = 3;
  // ISO 3166-1 alpha-2.
  string country_code = 4;
}

message ListMobileMoneyNetworksResponse {
  repeated MobileMoneyNetwork networks = 1;
}

message ValidateBankAccountRequest {
  // ISO 3166-1 alpha-2.
  string country_code = 1;
  // The bank code from ListBanks.
  string bank_code = 2;
  string account_number = 3;
}

message ValidateBankAccountResponse {
  // "Valid", "Invalid" or "Unknown" (provider could not say).
  string status = 1;
  // Present when the provider named the holder.
  string account_name = 2;
  string failure_reason = 3;
}

message CreateBusinessPaymentRequest {
  string business_id = 1;
  BusinessApiEnvironment environment = 2;
  // The caller's reference for this payment, 1-100 characters. The idempotency key.
  string client_reference = 3;
  // The API key that asked, for the audit trail and per-key reporting.
  string api_key_id = 4;
  // Destination country, ISO 3166-1 alpha-2.
  string country_code = 5;
  // A Compliance payout rail: "BankTransfer", "MobileMoney", "Interac" or "Spei".
  string rail = 6;
  // What the recipient receives, in payout_currency.
  string amount = 7;
  string payout_currency = 8;
  // The account debited; empty means payout_currency. When it differs, Wallet converts through its
  // FX pricing (the business's rate where one applies) and debits the funding equivalent.
  string funding_currency = 9;
  // The route's destination fields, by the keys Compliance defines for (country, rail), e.g.
  // bankCode/accountNumber/accountName for NG BankTransfer.
  map<string, string> destination = 10;
  string narration = 11;
  // Empty: fund from the business's main account. Set: fund from that sub-account's account in
  // funding_currency. The business's API limits apply either way.
  string sub_account_id = 12;
  // The business's customer on whose behalf the business pays (Identity's BusinessCustomer id):
  // recorded as the payment's originator, screened and sent as sender details where the provider
  // takes them. Must belong to the business in this environment, be KYC-approved and not archived
  // (else FAILED_PRECONDITION CUSTOMER_NOT_FOUND / CUSTOMER_NOT_VERIFIED / CUSTOMER_ARCHIVED). The
  // business (or sub_account_id) is still what is debited, under the same limits. Empty: none.
  string customer_id = 13;
}

message GetBusinessPaymentRequest {
  string business_id = 1;
  BusinessApiEnvironment environment = 2;
  oneof key {
    string payment_id = 3;
    string client_reference = 4;
  }
  // When set, the payment must belong to this sub-account, else PAYMENT_NOT_FOUND.
  string sub_account_id = 5;
}

message BusinessPayment {
  string id = 1;
  string client_reference = 2;
  BusinessApiEnvironment environment = 3;
  // A BusinessPaymentStatus name: "Pending", "Processing", "Completed", "Failed", "Cancelled".
  string status = 4;
  string rail = 5;
  string country_code = 6;
  string payout_currency = 7;
  string payout_amount = 8;
  string funding_currency = 9;
  string funding_amount = 10;
  // Funding → payout; "1" when no conversion.
  string exchange_rate = 11;
  string fee_amount = 12;
  map<string, string> destination = 13;
  string narration = 14;
  string provider_reference = 15;
  string failure_code = 16;
  string failure_reason = 17;
  string api_key_id = 18;
  string created_at = 19;
  string updated_at = 20;
  // Empty until the payment reaches Completed.
  string completed_at = 21;
  // Empty when funded from the business's main account.
  string sub_account_id = 22;
  // The originator, when the payment was made on a customer's behalf; all three empty otherwise.
  // Name and country are as they were when the payment was made.
  string customer_id = 23;
  string customer_name = 24;
  string customer_country = 25;
}

message ListBusinessPaymentsRequest {
  string business_id = 1;
  BusinessApiEnvironment environment = 2;
  // A status name; empty means every status.
  string status = 3;
  // ISO 4217 payout currency; empty means every currency.
  string currency_code = 4;
  // ISO 8601 bounds on created_at; empty means unbounded.
  string from = 5;
  string to = 6;
  // 1-based; page size is clamped to 1..200.
  int32 page = 7;
  int32 page_size = 8;
  // ISO 4217 currency of the account debited; empty means every funding currency. Distinct from
  // currency_code, which is what the recipient receives: a USD-funded NGN payout matches
  // funding_currency "USD" and currency_code "NGN".
  string funding_currency = 9;
  // Empty: every payment of the business. Set: only payments funded from that sub-account.
  string sub_account_id = 10;
  // Empty: every payment. Set: only payments made on that customer's behalf.
  string customer_id = 11;
}

message ListBusinessPaymentsResponse {
  repeated BusinessPayment payments = 1;
  int64 total_count = 2;
}

message SimulateSandboxFundingRequest {
  string business_id = 1;
  // ISO 4217, e.g. "CAD" for Interac, "MXN" for SPEI.
  string currency = 2;
  string amount = 3;
  // "Interac" or "Spei" — recorded on the ledger line so the credit reads like the pay-in it stands for.
  string rail = 4;
  // The caller's reference; the idempotency key. 1-100 characters.
  string reference = 5;
  string sender_name = 6;
}

message SimulateSandboxFundingResponse {
  // The ledger entry that credited the account.
  string entry_id = 1;
  string account_id = 2;
  string currency = 3;
  string amount = 4;
  string balance_after = 5;
  // False when this reference had already been credited and nothing new was posted.
  bool created = 6;
}

message OpenSubAccountWalletsRequest {
  string business_id = 1;
  BusinessApiEnvironment environment = 2;
  string sub_account_id = 3;
  // ISO 4217 codes.
  repeated string currencies = 4;
}

message CloseSubAccountWalletsRequest {
  string business_id = 1;
  BusinessApiEnvironment environment = 2;
  string sub_account_id = 3;
}

message CloseSubAccountWalletsResponse {
  int32 closed_accounts = 1;
}

// One side of an internal transfer: the business's main account, or a sub-account's, in a currency.
message InternalTransferParty {
  // Empty: the business's main account.
  string sub_account_id = 1;
}

message InternalTransferRequest {
  string business_id = 1;
  BusinessApiEnvironment environment = 2;
  // Required for CreateInternalTransfer; ignored by QuoteInternalTransfer. 1-100 characters.
  string client_reference = 3;
  InternalTransferParty from = 4;
  InternalTransferParty to = 5;
  // Debited from `from`, in origin_currency.
  string amount = 6;
  string origin_currency = 7;
  string destination_currency = 8;
  string narration = 9;
}

message InternalTransferQuote {
  string origin_currency = 1;
  string origin_amount = 2;
  string destination_currency = 3;
  string destination_amount = 4;
  // Origin → destination; "1" when the currencies match.
  string rate = 5;
  string expires_at = 6;
}

message InternalTransfer {
  string id = 1;
  string client_reference = 2;
  InternalTransferParty from = 3;
  InternalTransferParty to = 4;
  string origin_currency = 5;
  string origin_amount = 6;
  string destination_currency = 7;
  string destination_amount = 8;
  string rate = 9;
  string created_at = 10;
}

enum PayInMethod {
  PAY_IN_METHOD_UNSPECIFIED = 0;
  // Interac e-Transfer request-money (Pateno). CAD.
  PAY_IN_METHOD_INTERAC_REQUEST = 1;
  // Flutterwave hosted card/bank payment link. NGN.
  PAY_IN_METHOD_CARD_LINK = 2;
}

message PayInPayer {
  string email = 1;
  string name = 2;
  // E.164, optional.
  string phone = 3;
}

message CreatePayInRequest {
  string business_id = 1;
  BusinessApiEnvironment environment = 2;
  // 1-100 characters. The idempotency key.
  string client_reference = 3;
  string api_key_id = 4;
  PayInMethod method = 5;
  // What the payer is asked to send, in `currency`.
  string amount = 6;
  string currency = 7;
  PayInPayer payer = 8;
  // Where the payer lands after a card/bank link payment. Ignored for Interac.
  string redirect_url = 9;
  string narration = 10;
  // Empty: credit the business's main account. Set: credit that sub-account's account in `currency`.
  string sub_account_id = 11;
  // 0 means Wallet's default (24 hours).
  int32 expires_in_seconds = 12;
}

message GetPayInRequest {
  string business_id = 1;
  BusinessApiEnvironment environment = 2;
  oneof key {
    string pay_in_id = 3;
    string client_reference = 4;
  }
}

message ListPayInsRequest {
  string business_id = 1;
  BusinessApiEnvironment environment = 2;
  // A status name; empty means every status.
  string status = 3;
  string currency = 4;
  string from = 5;
  string to = 6;
  string sub_account_id = 7;
  int32 page = 8;
  int32 page_size = 9;
}

message ListPayInsResponse {
  repeated PayIn pay_ins = 1;
  int64 total_count = 2;
}

message CancelPayInRequest {
  string business_id = 1;
  BusinessApiEnvironment environment = 2;
  string pay_in_id = 3;
}

message SimulatePayInRequest {
  string business_id = 1;
  string pay_in_id = 2;
  // "paid", "failed", "expired" or "fraud".
  string outcome = 3;
}

message PayIn {
  string id = 1;
  string client_reference = 2;
  BusinessApiEnvironment environment = 3;
  PayInMethod method = 4;
  // "Pending", "Paid", "Failed", "Expired" or "Cancelled".
  string status = 5;
  string amount = 6;
  string currency = 7;
  // What reached the business's account once Paid (after any provider fee); empty before.
  string credited_amount = 8;
  string credited_currency = 9;
  string fee_amount = 10;
  // The link the payer opens (card link, Interac gateway); empty in sandbox.
  string payment_url = 11;
  string provider_reference = 12;
  PayInPayer payer = 13;
  string sub_account_id = 14;
  string failure_code = 15;
  string failure_reason = 16;
  string narration = 17;
  string api_key_id = 18;
  string expires_at = 19;
  string paid_at = 20;
  string created_at = 21;
  string updated_at = 22;
}

message GetPayInInstructionsRequest {
  string business_id = 1;
  BusinessApiEnvironment environment = 2;
  // "USD" (bank transfer) or "CAD" (Interac e-Transfer to email).
  string currency = 3;
}

message PayInInstructions {
  string currency = 1;
  string bank_name = 2;
  string account_number = 3;
  string routing_number = 4;
  // What the sender must quote so the credit can be matched: the business's merchant ID.
  string reference = 5;
  // CAD only: the address to send the Interac e-Transfer to.
  string interac_email = 6;
  // A plain sentence for the payer.
  string notes = 7;
  // True in SANDBOX: the values are samples and nothing sent there is credited.
  bool sample = 8;
}

message ListBankBranchesRequest {
  // Bank.id from ListBanks.
  int32 bank_id = 1;
}

message BankBranch {
  int32 id = 1;
  string branch_code = 2;
  string branch_name = 3;
  string swift_code = 4;
  string bic = 5;
  int32 bank_id = 6;
}

message ListBankBranchesResponse {
  repeated BankBranch branches = 1;
}

message EstimateFeesRequest {
  string business_id = 1;
  BusinessApiEnvironment environment = 2;
  string amount = 3;
  string currency = 4;
  // "BankTransfer", "MobileMoney", "Interac", "Spei" (payouts) or "InteracRequest", "CardLink" (pay-ins).
  string rail = 5;
  // "payout" or "funding".
  string direction = 6;
}

message FeeEstimate {
  string amount = 1;
  string currency = 2;
  string rail = 3;
  string direction = 4;
  string platform_fee = 5;
  string rail_fee = 6;
  string total_fee = 7;
  // Funding: what reaches the account (amount − total_fee). Payout: what is debited (amount + total_fee).
  string net_amount = 8;
  // A plain sentence on how the figure was reached.
  string note = 9;

  // --- 0.34.0: the fee schedule's own figures (additive; the fields above keep their meaning) ---
  // Tiki's fee from the matching fee rule, before tax. "0" when no rule matched.
  string fee = 10;
  // Tax on the transaction amount at the tenant's rate. "0" when no rate is in force.
  string tax = 11;
  // The tax's name as staff configured it, e.g. "VAT". Empty when there is no tax.
  string tax_label = 12;
  // How the business pays it: "OnTop", "Deducted" or "Accrued" (the business's FeeModel).
  string collection = 13;
  // The business's FeeModel member name, e.g. "PayloadDeduction".
  string fee_model = 14;
  // What leaves (payout) or is credited to (funding) the business's balance.
  string debit_amount = 15;
  // What the recipient receives (payout) or what the payer sends (funding).
  string recipient_amount = 16;
  // Chimoney's netAmount: amount − (fee + tax), whatever the direction.
  string chimoney_net_amount = 17;
  // The fee rule and tax rate that priced it; empty when none matched.
