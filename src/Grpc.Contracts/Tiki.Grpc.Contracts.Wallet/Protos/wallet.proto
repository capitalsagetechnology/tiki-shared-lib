syntax = "proto3";

option csharp_namespace = "Tiki.Grpc.Contracts.Wallet";

package tiki.grpc.contracts.wallet;

import "google/protobuf/timestamp.proto";

// Owning service: Wallet. This package carries both the client stub every caller
// consumes and the service base class Wallet's own implementation derives from.
service WalletService {
  rpc CreateWallet (CreateWalletRequest) returns (CreateWalletResponse);
}

message CreateWalletRequest {
  string account_id = 1;
}

message CreateWalletResponse {
  string id = 1;
  string account_id = 2;
  WalletStatus status = 3;
  google.protobuf.Timestamp created_at = 4;
}

enum WalletStatus {
  WALLET_STATUS_UNSPECIFIED = 0;
  WALLET_STATUS_ACTIVE = 1;
  WALLET_STATUS_FROZEN = 2;
  WALLET_STATUS_CLOSED = 3;
}
